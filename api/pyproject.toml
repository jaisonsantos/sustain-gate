[tool.poetry]
name = "ssdr-api"
version = "1.0.0"
description = "SSDR API Backend"
authors = ["SSDR Team <dev@ssdr.dev>"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.1"
uvicorn = "^0.24.0"
sqlalchemy = "^2.0.23"
psycopg2-binary = "^2.9.9"
alembic = "^1.12.1"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
python-multipart = "^0.0.6"
pydantic-settings = "^2.0.3"
redis = "^5.0.1"
pandas = "^2.1.3"
openpyxl = "^3.1.2"
pyxlsb = "^1.0.10"
jinja2 = "^3.1.2"
boto3 = "^1.34.0"
rq = "^1.15.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
black = "^23.11.0"
isort = "^5.12.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"