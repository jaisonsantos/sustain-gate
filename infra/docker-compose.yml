version: "3.9"

services:
  # Database
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ssdr
      POSTGRES_USER: app
      POSTGRES_PASSWORD: pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d ssdr"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # FastAPI Backend
  api:
    build: ../api
    ports:
      - "8000:8000"
    environment:
      POSTGRES_URI: postgresql+psycopg2://app:pass@db:5432/ssdr
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: ssdr-evidences
      JWT_SECRET: change_me_in_production
      ALLOWED_ORIGINS: http://localhost:5173,http://frontend:5173
    volumes:
      - api_data:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Background Worker
  worker:
    build: ../worker
    environment:
      POSTGRES_URI: postgresql+psycopg2://app:pass@db:5432/ssdr
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: ssdr-evidences
    volumes:
      - api_data:/data
    depends_on:
      - db
      - redis
      - api

  # Frontend (optional - if building from this compose)
  frontend:
    build: ../
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: http://localhost:8000
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  minio_data:
  api_data:

networks:
  default:
    name: ssdr_network